<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>33 TIGER | 香港政府、醫管局與 NCSC 職缺實時大典</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#050807',
                            card: '#0a120e',
                            green: '#00ff66',
                            cyan: '#00e5ff',
                            yellow: '#facc15'
                        }
                    },
                    fontFamily: {
                        mono: ['Share Tech Mono', 'Courier New', 'Consolas', 'monospace'],
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050807; color: #e2e8f0; font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        .cyber-glow { box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 3px;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyber-green selection:text-black">

    <!-- CRT Visual Effect -->
    <div class="fixed inset-0 crt-overlay z-50 pointer-events-none opacity-30"></div>

    <!-- Header Navigation -->
    <header class="border-b border-emerald-900/60 bg-black/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-xl font-mono font-bold tracking-wider text-white">33 <span class="text-cyber-green">TIGER</span></span>
                <span class="text-[10px] font-mono px-1.5 py-0.5 bg-emerald-950 text-cyber-green border border-emerald-500/30 rounded">GOV OPEN API</span>
            </a>
            <nav class="flex items-center gap-4 text-xs font-mono">
                <a href="index.html" class="text-slate-400 hover:text-cyber-green transition"><i class="fa-solid fa-house mr-1"></i>主頁</a>
                <a href="jobs.html" class="text-cyber-green font-bold"><i class="fa-solid fa-briefcase mr-1"></i>職缺大典</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Header Section -->
        <div class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 font-mono">
                <i class="fa-solid fa-building-columns text-cyber-green mr-2"></i>政府職位空缺即時查詢系統
            </h1>
            <p class="text-xs md:text-sm text-slate-400 font-mono">直連香港特別行政區政府公務員事務局 (CSB) 官方職位招聘資料庫</p>
        </div>

        <!-- Interactive Control Bar -->
        <div class="bg-black/70 border border-emerald-900/80 rounded-xl p-3 md:p-4 mb-4 cyber-glow flex flex-col sm:flex-row justify-between items-center gap-3 font-mono text-xs">
            <div class="flex items-center gap-2 text-slate-300 w-full sm:w-auto">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyber-green animate-pulse"></span>
                <span>官方系統狀態：<span class="text-cyber-green font-bold">已嵌入安全連線 (HTTPS)</span></span>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="reloadIframe()" class="px-3 py-1.5 bg-zinc-900 text-slate-300 border border-emerald-900 hover:border-cyber-green hover:text-white rounded transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate" id="reload-icon"></i> 重新載入
                </button>
                <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-cyber-green text-black font-bold rounded hover:bg-emerald-400 transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-expand"></i> 全螢幕模式
                </button>
                <a href="https://csboa1.csb.gov.hk/csboa/jve/JVE_001_zh.action" target="_blank" class="px-3 py-1.5 bg-yellow-400 text-black font-bold rounded hover:bg-yellow-300 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 新分頁開啟
                </a>
            </div>
        </div>

        <!-- Embedded Government iFrame Container -->
        <div id="iframe-wrapper" class="relative w-full rounded-xl border border-emerald-900/80 bg-zinc-950 shadow-2xl overflow-hidden transition-all duration-300" style="height: 780px;">
            <!-- Loading Indicator -->
            <div id="iframe-loader" class="absolute inset-0 bg-black/90 z-10 flex flex-col items-center justify-center text-cyber-green font-mono space-y-3">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                <div class="animate-pulse text-xs sm:text-sm">正在載入公務員事務局官方職位空缺頁面...</div>
            </div>

            <!-- Official Government Vacancy iFrame -->
            <iframe 
                id="gov-jobs-iframe"
                src="https://csboa1.csb.gov.hk/csboa/jve/JVE_001_zh.action" 
                class="w-full h-full border-0 rounded-xl"
                title="香港政府職位空缺查詢系統"
                onload="hideIframeLoader()"
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups">
            </iframe>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-emerald-900/60 bg-black py-6 text-center text-xs font-mono text-slate-500">
        <p>33 TIGER 虎哥社區資訊網 | 香港政府與公營機構招聘大典 © 2026</p>
    </footer>

    <!-- iFrame Control Scripts -->
    <script>
        function hideIframeLoader() {
            const loader = document.getElementById('iframe-loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        }

        function reloadIframe() {
            const iframe = document.getElementById('gov-jobs-iframe');
            const loader = document.getElementById('iframe-loader');
            const icon = document.getElementById('reload-icon');

            if (loader) loader.classList.remove('hidden');
            if (icon) icon.classList.add('fa-spin');

            if (iframe) {
                iframe.src = iframe.src;
            }

            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
            }, 1000);
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('iframe-wrapper');
            if (!wrapper) return;

            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) { /* Safari */
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
