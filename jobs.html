    // 頁面載入完成後自動執行官方 API 抓取
    document.addEventListener('DOMContentLoaded', () => {
        fetchOfficialGovernmentJobsApi();
    });

    async function fetchOfficialGovernmentJobsApi() {
        const container = document.getElementById('all-jobs-container');
        if (!container) return;

        // 1. 顯示連線中動畫
        container.innerHTML = `
            <div class="col-span-2 text-center py-12 text-cyber-green font-mono animate-pulse">
                <i class="fa-solid fa-satellite-dish fa-spin text-2xl mb-2"></i>
                <div>正在連線至 DATA.GOV.HK 官方 Open API 數據庫...</div>
            </div>
        `;

        try {
            // 使用跨域代理服務讀取政府官方 JSON API
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.csb.gov.hk/datagovhk/gov-vacancies/gov-job-vacancies-tc.json');
            
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('官方 API 連線回應異常');

            const vacancies = await response.json();
            
            // 檢查並渲染官方數據
            if (Array.isArray(vacancies) && vacancies.length > 0) {
                container.innerHTML = ''; // 清空載入中提示
                
                vacancies.slice(0, 15).forEach((item, index) => {
                    const dept = item.deptName || item.Department || "政府部門";
                    const title = item.jobTitle || item.Title || "政府職位空缺";
                    const salary = item.salary || item.Salary || "按官方公佈為準";
                    const deadline = item.closingDate || item.Deadline || "請參閱詳情";
                    const link = item.url || item.Link || "https://www.csb.gov.hk/tc_chi/recruitment/list.html";

                    const card = document.createElement('div');
                    card.className = "bg-zinc-950 border border-emerald-900/60 p-5 rounded-xl font-mono text-xs space-y-3 hover:border-cyber-green transition shadow-lg flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-emerald-950 text-cyber-green border border-emerald-500/30 px-2 py-0.5 rounded text-[10px]">${dept}</span>
                                <span class="text-yellow-400"><i class="fa-regular fa-clock mr-1"></i>截止: ${deadline}</span>
                            </div>
                            <h4 class="text-sm font-bold text-white mb-1 font-sans">${title}</h4>
                            <p class="text-cyber-green font-bold mb-2"><i class="fa-solid fa-coins mr-1"></i>${salary}</p>
                        </div>
                        <div class="pt-3 border-t border-emerald-950 flex justify-between items-center">
                            <span class="text-[10px] text-slate-400 bg-zinc-900 px-2 py-0.5 rounded">官方即時 API</span>
                            <a href="${link}" target="_blank" class="text-cyber-green hover:underline flex items-center gap-1 font-bold">
                                查看官方詳情 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                throw new Error("無數據或數據格式不符合要求");
            }

            console.warn("API 讀取失敗或跨域被阻擋，切換至備份渲染:", error);
            // 發生錯誤時顯示友情提示
